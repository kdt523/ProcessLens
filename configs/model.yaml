# Split, preprocessing, models and evaluation.
seed: 42
split:
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
  cv_folds: 4                 # rolling-origin folds inside train
preprocess:
  max_missing_frac: 0.50      # computed on train only
  impute_strategy: median
  add_indicator: true
models:
  logreg_l2: {C: 0.1, max_iter: 5000}
  logreg_l1: {C: 0.1, max_iter: 5000}
  random_forest: {n_estimators: 500, max_depth: 6, min_samples_leaf: 5}
  lightgbm:
    n_estimators: 1000
    learning_rate: 0.02
    num_leaves: 7
    max_depth: 3
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    early_stopping_rounds: 100
    early_stopping_frac: 0.20   # last 20% (by time) of each fit window; val is kept for selection
selection:
  reference_model: logreg_l2   # paired-bootstrap comparison baseline
  metric: pr_auc
evaluation:
  bootstrap_iters: 2000
  ci_level: 0.95
  min_precision: 0.20         # report recall at precision >= this
  ece_bins: 10
calibration:
  # sigmoid (Platt): validation holds only ~11 failures; isotonic would overfit that
  method: sigmoid             # sigmoid | isotonic
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlruns
  experiment: processlens-defects
  registered_model: processlens-defect-model

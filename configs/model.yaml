# Split, preprocessing, models and evaluation.
seed: 42
split:
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
  cv_folds: 4                 # rolling-origin folds inside train
preprocess:
  max_missing_frac: 0.50      # computed on train only
  impute_strategy: median
  add_indicator: true
models:
  logreg_l2: {C: 0.1, max_iter: 5000}
  logreg_l1: {C: 0.1, max_iter: 5000}
  random_forest: {n_estimators: 500, max_depth: 6, min_samples_leaf: 5}
  lightgbm:
    n_estimators: 1000
    learning_rate: 0.02
    num_leaves: 7
    max_depth: 3
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    early_stopping_rounds: 100
evaluation:
  bootstrap_iters: 2000
  ci_level: 0.95
  min_precision: 0.20         # report recall at precision >= this
  ece_bins: 10
calibration:
  method: isotonic            # isotonic | sigmoid
mlflow:
  tracking_uri: mlruns
  experiment: processlens-defects
  registered_model: processlens-defect-model

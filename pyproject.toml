[project]
name = "processlens"
version = "0.1.0"
description = "Manufacturing root-cause analyzer with a planted-fault benchmark and a guarded LLM copilot (UCI SECOM)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.142.2",
    "langchain-core==1.6.6",
    "langchain-google-genai==4.4.0",
    "langgraph==1.2.13",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "mlflow==3.16.1",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pandera==0.34.0",
    "plotly==7.1.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "ruptures==1.1.10",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "shap==0.51.0",
    "statsmodels==0.15.0",
    "streamlit==1.65.0",
    "typer==0.27.2",
    "ucimlrepo==0.0.7",
    "uvicorn==0.54.0",
]

[project.scripts]
processlens = "processlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processlens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"app/**" = ["D"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: long-running tests", "live: needs network or API key"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

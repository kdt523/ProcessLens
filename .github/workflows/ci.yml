name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Ingest SECOM (data contract validated on load)
        run: make ingest

      - name: Tests with coverage (contract, leakage, methods, verifier, agent replay, API, app)
        run: uv run pytest --cov=processlens --cov-report=term-missing:skip-covered

      - name: Benchmark smoke gate
        run: make benchmark-smoke
